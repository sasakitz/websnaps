<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSnaps</title>
  <link rel="icon" href="../icons/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo"><img class="brand-icon" src="../icons/brand.svg" alt=""><div>WebSnaps<span class="brand-caption">ひらめきを、切り取ろう。</span></div></div>
      <a href="#" id="settings-link" class="settings-btn" title="ショートカット設定" aria-label="ショートカット設定">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 12h.01M11 12h.01M15 12h.01M8 15h8"/></svg>
      </a>
    </header>
    <main>
      <section class="capture-section" aria-labelledby="capture-heading">
        <div class="section-heading"><h1 id="capture-heading">どこを撮影しますか？</h1><span class="step-badge">01 / CAPTURE</span></div>
        <div class="capture-grid">
          <button class="capture-btn featured" data-mode="selection">
            <span class="capture-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1.5" stroke-dasharray="2 3"/></svg></span>
            <span class="capture-info"><span class="capture-label">範囲を選択<span class="recommend-badge">おすすめ</span></span><span class="capture-description">ドラッグ・要素選択で、必要な部分だけ</span><kbd class="capture-shortcut" data-command="capture-selection">Alt+Shift+S</kbd></span>
            <span class="capture-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="capture-btn" data-mode="visible">
            <span class="capture-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M8 21h8m-4-3v3M3 8h18"/></svg></span>
            <span class="capture-info"><span class="capture-label">表示範囲</span><span class="capture-description">今、画面に見えている部分を撮影</span><kbd class="capture-shortcut" data-command="capture-visible">Alt+Shift+V</kbd></span>
            <span class="capture-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="capture-btn" data-mode="fullpage">
            <span class="capture-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6m-8 3v6m-3-3 3 3 3-3"/></svg></span>
            <span class="capture-info"><span class="capture-label">ページ全体</span><span class="capture-description">スクロールする長いページも、1枚に</span><kbd class="capture-shortcut" data-command="capture-fullpage">Alt+Shift+F</kbd></span>
            <span class="capture-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>
      <section class="output-section" aria-label="保存形式">
        <div><h2>画像の形式</h2><p id="format-hint">PNG · 文字や図をくっきり保存</p></div>
        <div class="toggle-group" id="format-group" role="group" aria-label="画像の保存形式">
          <button class="toggle-btn active" data-value="png" aria-pressed="true">PNG</button>
          <button class="toggle-btn" data-value="jpg" aria-pressed="false">JPG</button>
        </div>
      </section>
      <p class="workflow-note"><span aria-hidden="true">✦</span> 撮影後に編集画面が開きます。保存もコピーも、そこから。</p>
      <p id="capture-error" class="capture-error" role="alert" hidden></p>
    </main>
    <footer class="footer"><span class="privacy-note"><span class="privacy-dot"></span>画像はブラウザ内で処理</span><a id="shortcuts-link" href="#">キー設定 <span aria-hidden="true">↗</span></a></footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
