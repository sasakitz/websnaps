<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSnaps Editor</title>
  <link rel="icon" href="../icons/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <img src="../icons/brand.svg" class="brand-icon" alt="">
          <span>WebSnaps <span class="editor-badge">EDITOR</span></span>
        </div>
        <div class="header-divider"></div>
        <div class="history-controls">
          <button id="btn-undo" class="icon-btn" aria-label="元に戻す (Ctrl+Z)" title="元に戻す (Ctrl+Z)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="9 14 4 9 9 4"/>
              <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
            </svg>
          </button>
          <button id="btn-redo" class="icon-btn" aria-label="やり直す (Ctrl+Y)" title="やり直す (Ctrl+Y)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="15 14 20 9 15 4"/>
              <path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
            </svg>
          </button>
        </div>
        <div class="header-divider"></div>
        <div class="zoom-controls">
          <button id="btn-zoom-out" class="icon-btn" aria-label="縮小" title="縮小">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button id="btn-zoom-in" class="icon-btn" aria-label="拡大" title="拡大">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button id="btn-zoom-fit" class="icon-btn" aria-label="全体を表示" title="全体を表示">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="header-right">
        <div class="format-group">
          <button class="format-btn active" data-format="png" aria-pressed="true">PNG</button>
          <button class="format-btn" data-format="jpg" aria-pressed="false">JPG</button>
        </div>
        <button id="btn-copy" class="action-btn secondary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          コピー
        </button>
        <button id="btn-save" class="action-btn primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          画像を保存
        </button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main">
      <!-- Left Toolbar -->
      <aside class="toolbar" aria-label="編集ツール">
        <div class="toolbar-caption">ツール</div>
        <div class="tool-group">
          <button class="tool-btn active" data-tool="select" aria-label="選択 (V)" aria-pressed="true" title="選択 (V)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M5 3l14 9-7 1-3 7L5 3z"/>
            </svg>
            <span class="tool-label">選択</span><kbd>V</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="pencil" aria-label="ペン (P)" aria-pressed="false" title="ペン (P)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg>
            <span class="tool-label">ペン</span><kbd>P</kbd>
          </button>
          <button class="tool-btn" data-tool="line" aria-label="直線 (L)" aria-pressed="false" title="直線 (L)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="5" y1="19" x2="19" y2="5"/>
            </svg>
            <span class="tool-label">直線</span><kbd>L</kbd>
          </button>
          <button class="tool-btn" data-tool="arrow" aria-label="矢印 (A)" aria-pressed="false" title="矢印 (A)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <line x1="5" y1="19" x2="19" y2="5"/>
              <polyline points="12 5 19 5 19 12"/>
            </svg>
            <span class="tool-label">矢印</span><kbd>A</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="rect" aria-label="四角形 (R)" aria-pressed="false" title="四角形 (R)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
            </svg>
            <span class="tool-label">四角形</span><kbd>R</kbd>
          </button>
          <button class="tool-btn" data-tool="ellipse" aria-label="楕円 (E)" aria-pressed="false" title="楕円 (E)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <ellipse cx="12" cy="12" rx="10" ry="6"/>
            </svg>
            <span class="tool-label">楕円</span><kbd>E</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="text" aria-label="テキスト (T)" aria-pressed="false" title="テキスト (T)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="4 7 4 4 20 4 20 7"/>
              <line x1="9" y1="20" x2="15" y2="20"/>
              <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            <span class="tool-label">テキスト</span><kbd>T</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="blur" aria-label="ぼかし (B)" aria-pressed="false" title="ぼかし (B)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8" stroke-dasharray="2 4"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="tool-label">ぼかし</span><kbd>B</kbd>
          </button>
          <button class="tool-btn" data-tool="mosaic" aria-label="モザイク (M)" aria-pressed="false" title="モザイク (M)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/></svg>
            <span class="tool-label">モザイク</span><kbd>M</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="eraser" aria-label="消しゴム (X)" aria-pressed="false" title="消しゴム (X)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 20H7L3 16l11-11 6 6-4 4"/>
              <path d="M6 11l6 6"/>
            </svg>
            <span class="tool-label">消しゴム</span><kbd>X</kbd>
          </button>
        </div>
        <div class="tool-separator"></div>
        <div class="tool-group">
          <button class="tool-btn" data-tool="crop" aria-label="切り抜き (C)" aria-pressed="false" title="切り抜き (C)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3v13a2 2 0 0 0 2 2h13M3 6h13a2 2 0 0 1 2 2v13"/></svg>
            <span class="tool-label">切り抜き</span><kbd>C</kbd>
          </button>
        </div>
      </aside>

      <!-- Canvas Workspace -->
      <div class="workspace" id="workspace">
        <div class="canvas-container" id="canvas-container">
          <canvas id="canvas"></canvas>
          <canvas id="crop-overlay"></canvas>
        </div>
        <div id="loading" class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">読み込み中...</div>
        </div>
        <!-- Crop confirm bar -->
        <div id="crop-bar" class="crop-bar hidden">
          <div class="crop-bar-info">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="6 2 6 6 2 6"/><polyline points="18 22 18 18 22 18"/>
              <path d="M6 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/>
              <rect x="12" y="12" width="10" height="10" rx="1"/>
            </svg>
            <span id="crop-size-label">ドラッグして範囲を選択</span>
          </div>
          <div class="crop-bar-actions">
            <button id="btn-crop-cancel" class="crop-btn-cancel">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              キャンセル
            </button>
            <button id="btn-crop-apply" class="crop-btn-apply" disabled>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              切り抜きを適用
            </button>
          </div>
        </div>
      </div>

      <!-- Right Options Panel -->
      <aside class="options-panel" id="options-panel" aria-label="ツールの設定">
        <div class="panel-intro"><div class="panel-eyebrow">TOOL SETTINGS</div><h1 id="tool-title">編集をはじめよう</h1><p id="tool-description">左のツールを選んで、画像に書き込めます。</p></div>
        <div class="editor-guide" id="editor-guide"><div class="guide-illustration" aria-hidden="true">↗ <span> Aa </span> ▧</div><h2>伝わる1枚に仕上げる</h2><p>矢印やテキストで注目ポイントを追加。見せたくない部分はモザイクで隠せます。</p><div class="guide-tip"><kbd>Ctrl / ⌘ + Z</kbd><span>ひとつ前に戻す</span></div><div class="guide-tip"><kbd>Ctrl / ⌘ + S</kbd><span>画像を保存</span></div></div>
        <!-- Color -->
        <div class="option-section" id="opt-color">
          <div class="option-label">カラー</div>
          <div class="color-row">
            <button class="color-preview" id="color-preview" aria-label="描画色を選ぶ" title="描画色を選ぶ"></button>
            <input type="color" id="color-input" aria-label="描画色" value="#ff3b3b">
          </div>
          <div class="color-presets" id="color-presets">
            <button class="color-preset active" style="background:#ff3b3b" data-color="#ff3b3b" aria-label="色 #ff3b3b" title="色 #ff3b3b"></button>
            <button class="color-preset" style="background:#ff9500" data-color="#ff9500" aria-label="色 #ff9500" title="色 #ff9500"></button>
            <button class="color-preset" style="background:#ffcc00" data-color="#ffcc00" aria-label="色 #ffcc00" title="色 #ffcc00"></button>
            <button class="color-preset" style="background:#34c759" data-color="#34c759" aria-label="色 #34c759" title="色 #34c759"></button>
            <button class="color-preset" style="background:#007aff" data-color="#007aff" aria-label="色 #007aff" title="色 #007aff"></button>
            <button class="color-preset" style="background:#af52de" data-color="#af52de" aria-label="色 #af52de" title="色 #af52de"></button>
            <button class="color-preset" style="background:#ff2d55" data-color="#ff2d55" aria-label="色 #ff2d55" title="色 #ff2d55"></button>
            <button class="color-preset" style="background:#ffffff" data-color="#ffffff" aria-label="色 #ffffff" title="色 #ffffff"></button>
            <button class="color-preset" style="background:#000000" data-color="#000000" aria-label="色 #000000" title="色 #000000"></button>
          </div>
        </div>

        <!-- Line Width -->
        <div class="option-section" id="opt-width">
          <div class="option-label">線の太さ</div>
          <div class="slider-row">
            <input type="range" id="width-slider" aria-label="線の太さ" min="1" max="30" value="3" class="slider">
            <span id="width-value" class="slider-value">3</span>
          </div>
          <div class="width-presets">
            <button class="width-preset" data-width="2" aria-label="線幅 2px" title="線幅 2px"><div style="height:2px;background:currentColor;border-radius:1px"></div></button>
            <button class="width-preset" data-width="4" aria-label="線幅 4px" title="線幅 4px"><div style="height:4px;background:currentColor;border-radius:2px"></div></button>
            <button class="width-preset" data-width="8" aria-label="線幅 8px" title="線幅 8px"><div style="height:8px;background:currentColor;border-radius:4px"></div></button>
            <button class="width-preset" data-width="16" aria-label="線幅 16px" title="線幅 16px"><div style="height:16px;background:currentColor;border-radius:8px"></div></button>
          </div>
        </div>

        <!-- Text Options (shown for text tool) -->
        <div class="option-section hidden" id="opt-text">
          <div class="option-label">フォントサイズ</div>
          <div class="slider-row">
            <input type="range" id="fontsize-slider" aria-label="フォントサイズ" min="10" max="72" value="20" class="slider">
            <span id="fontsize-value" class="slider-value">20</span>
          </div>
          <div class="option-label" style="margin-top: 10px;">フォント</div>
          <select id="font-select" aria-label="フォント" class="select">
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Helvetica Neue', sans-serif">Helvetica</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier</option>
            <option value="Impact, sans-serif">Impact</option>
          </select>
          <div class="option-label" style="margin-top: 10px;">スタイル</div>
          <div class="btn-group">
            <button class="style-btn" id="btn-bold" data-style="bold" title="太字">B</button>
            <button class="style-btn italic-btn" id="btn-italic" data-style="italic" title="斜体">I</button>
          </div>
        </div>

        <!-- Blur/Mosaic Options -->
        <div class="option-section hidden" id="opt-effect">
          <div class="option-label">強度</div>
          <div class="slider-row">
            <input type="range" id="effect-slider" aria-label="効果の強度" min="2" max="30" value="10" class="slider">
            <span id="effect-value" class="slider-value">10</span>
          </div>
        </div>

        <!-- Shape Fill Option -->
        <div class="option-section hidden" id="opt-shape">
          <div class="option-label">塗りつぶし</div>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="fill-toggle" aria-label="図形の塗りつぶし">
              <span class="toggle-track"></span>
            </label>
            <span id="fill-label">オフ</span>
          </div>
          <div id="fill-color-row" class="option-section hidden" style="padding: 0; border: none;">
            <div class="option-label" style="margin-top: 8px;">塗り色</div>
            <div class="color-row">
              <button class="color-preview" id="fill-color-preview" aria-label="塗りつぶし色を選ぶ" title="塗りつぶし色を選ぶ"></button>
              <input type="color" id="fill-color-input" aria-label="塗りつぶし色" value="#ff3b3b">
            </div>
          </div>
        </div>

        <!-- Opacity -->
        <div class="option-section" id="opt-opacity">
          <div class="option-label">不透明度</div>
          <div class="slider-row">
            <input type="range" id="opacity-slider" aria-label="不透明度" min="10" max="100" value="100" class="slider">
            <span id="opacity-value" class="slider-value">100%</span>
          </div>
        </div>

        <div class="option-section" id="opt-eraser" style="display:none">
          <div class="option-label">消しゴムサイズ</div>
          <div class="slider-row">
            <input type="range" id="eraser-slider" aria-label="消しゴムサイズ" min="5" max="80" value="20" class="slider">
            <span id="eraser-value" class="slider-value">20</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Status Bar -->
    <div class="statusbar">
      <span id="status-size">--</span>
      <span class="status-sep">|</span>
      <span id="status-pos">--</span>
      <span class="status-sep">|</span>
      <span id="status-tool">選択</span><span class="status-hint">Ctrl / ⌘ + スクロールで拡大・縮小</span>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../shared/capture-store.js"></script>
  <script src="editor.js"></script>
</body>
</html>
